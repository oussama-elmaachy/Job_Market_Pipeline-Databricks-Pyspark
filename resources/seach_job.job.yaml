resources:
  jobs:
    Job_Market_Pipeline:
      name: Job_Market_Pipeline
      schedule:
        quartz_cron_expression: 0 0 13,20 ? * MON-FRI
        timezone_id: Europe/Paris
        pause_status: ${var.pause_mode}

      tasks:
        - task_key: ingestion_data
          notebook_task:
            notebook_path: ../notebooks/api_ingestion.ipynb
            source: WORKSPACE
          max_retries: 2
          min_retry_interval_millis: 300000
          disable_auto_optimization: false
          environment_key: Default

        - task_key: new_records
          depends_on:
            - task_key: ingestion_data
          condition_task:
            op: GREATER_THAN
            left: "{{tasks.ingestion_data.values.upsert_rows}}"
            right: "0"

        - task_key: silver_transformations
          depends_on:
            - task_key: new_records
              outcome: "true"
          notebook_task:
            notebook_path: ../notebooks/clear_transform_data.ipynb
            source: WORKSPACE

        - task_key: gold_aggregation
          depends_on:
            - task_key: silver_transformations
          notebook_task:
            notebook_path: ../notebooks/analytics_summarized.ipynb
            source: WORKSPACE
          max_retries: 2
          min_retry_interval_millis: 900000
          disable_auto_optimization: false

        - task_key: dim_employer
          depends_on:
            - task_key: new_records
              outcome: "true"
          notebook_task:
            notebook_path: ../notebooks/dim_employer.ipynb
            source: WORKSPACE

        - task_key: dim_location
          depends_on:
            - task_key: new_records
              outcome: "true"
          notebook_task:
            notebook_path: ../notebooks/dim_location.ipynb
            source: WORKSPACE

        - task_key: dim_publisher
          depends_on:
            - task_key: new_records
              outcome: "true"
          notebook_task:
            notebook_path: ../notebooks/dim_publisher.ipynb
            source: WORKSPACE

      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED