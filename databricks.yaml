bundle:
  name: Job_Market_Pipeline

variables:
  pause_mode:
    description:  job pause description
    default: UNPAUSED

include:
  - resources/seach_job.job.yaml

targets:
  dev:
    mode: development
    default: true
    variables:
      pause_mode: UNPAUSED

  prod:
    mode: production
    workspace:
      host: https://dbc-742163b5-50c1.cloud.databricks.com
      root_path: /Workspace/Shared/${bundle.name}/${bundle.target}
    variables:
      pause_mode: UNPAUSED



